<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>새 사이트로 이동 | HMSOFT</title><link rel="canonical" href="https://hmdesign.cloud/">
<script>
const target=new URL("https://hmdesign.cloud/");
const prefix="/template_hub";
let path=location.pathname;
if(prefix && (path===prefix || path.startsWith(prefix+'/')))path=path.slice(prefix.length);
if(path==='/index.html')path='/';
target.pathname='/'+path.replace(/^\/+/, '');
target.search=location.search;
target.hash=location.hash;
location.replace(target.href);
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://hmdesign.cloud/"></noscript>
</head><body><main><h1>사이트 주소가 변경되었습니다.</h1><p><a href="https://hmdesign.cloud/">새 사이트 열기</a></p></main></body></html>
